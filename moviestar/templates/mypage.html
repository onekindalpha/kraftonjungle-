<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <title>내가 좋아요한 영화</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <style>
        .movie-list {
            width: 600px;
            margin: 30px auto;
        }

        .card {
            margin-bottom: 15px;
            padding: 12px;
        }

        .movie-poster {
            width: 90px;
            height: 130px;
            object-fit: cover;
            border-radius: 6px;
        }
    </style>

    <script>
        $(document).ready(function () {
            showMyLikedMovies()
        });

        function showMyLikedMovies() {
            $('#movie-box').empty()

            $.ajax({
                type: "GET",
                url: "/api/my/likes",
                data: {},
                success: function (response) {
                    let movies = response['movies_list']

                    for (let i = 0; i < movies.length; i++) {
                        let movie = movies[i]
                        let rank = i + 1

                        let title = movie['title']
                        let posterUrl = movie['poster_url']
                        let infoUrl = movie['info_url']
                        let viewers = movie['viewers']
                        let likes = movie['likes']

                        let tempHtml = `
                          <div class="card">
                              <div style="display: flex; align-items: center; gap: 14px;">
                                  <div style="width: 42px; text-align: center; font-size: 24px; font-weight: bold;">
                                      ${rank}
                                  </div>

                                  <img src="${posterUrl}" class="movie-poster"/>

                                  <div>
                                      <a href="${infoUrl}" target="_blank">${title}</a>
                                      <br/>
                                      좋아요 ${likes}
                                      <br/>
                                      누적관객수 ${viewers.toLocaleString()} 명
                                      <br/>
                                      <button class="btn btn-danger btn-sm mt-2" onclick="unlikeMovie('${movie['_id']}')">
                                          좋아요 취소
                                      </button>
                                  </div>
                              </div>
                          </div>
                      `

                        $('#movie-box').append(tempHtml)
                    }
                }
            })
        }
        function unlikeMovie(id) {
          $.ajax({
              type: "POST",
              url: "/api/unlike",
              data: {
                  id_give: id
              },
              success: function (response) {
                  alert(response["msg"])

                  if (response["result"] == "success") {
                      showMyLikedMovies()
                  }
              }
          })
      }
    </script>
</head>

<body>
    <div class="container text-center mt-4">
        <h1>내가 좋아요한 영화</h1>
        <a href="/" class="btn btn-primary mt-3">영화 목록으로 돌아가기</a>
    </div>

    <div class="movie-list" id="movie-box"></div>
</body>
</html>
